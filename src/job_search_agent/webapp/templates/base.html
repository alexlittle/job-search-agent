<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Job Search Agent{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, system-ui, sans-serif;
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.5;
    }
    nav { margin-bottom: 1.5rem; display: flex; gap: 1.25rem; }
    nav a { text-decoration: none; color: inherit; font-weight: 600; }
    h1 { margin-bottom: 0.25rem; }
    .stats { color: #777; font-size: 0.9rem; margin-bottom: 1.5rem; }
    .group { margin-bottom: 2rem; }
    .group h2 { border-bottom: 2px solid currentColor; padding-bottom: 0.25rem; }
    .listing {
      border: 1px solid #8884;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .listing h3 { margin: 0 0 0.25rem 0; }
    .listing .meta { color: #777; font-size: 0.9rem; margin-bottom: 0.5rem; }
    .score { font-weight: 700; font-size: 1.05rem; margin-bottom: 0.4rem; }
    ul.plain { margin: 0.25rem 0; padding-left: 1.2rem; }
    .matched li { color: #2a8a4a; }
    .concern li { color: #b5651d; }
    .reason { color: #b5651d; font-style: italic; }
    .empty { color: #888; font-style: italic; }
    .feedback { margin-top: 0.75rem; }
    .feedback input[type=text] {
      width: 100%;
      box-sizing: border-box;
      padding: 0.4rem;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }
    .feedback-buttons { display: flex; gap: 0.5rem; }
    .feedback button {
      font-size: 0.85rem;
      padding: 0.3rem 0.7rem;
      border-radius: 6px;
      border: 1px solid #8886;
      background: transparent;
      color: inherit;
      cursor: pointer;
    }
    .feedback button:disabled {
      cursor: default;
      font-weight: 600;
      border-color: currentColor;
    }
    .hide-form { display: inline; }
    .hide-btn { opacity: 0.75; }
    .saved-indicator {
      margin-left: 0.6rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: #2a8a4a;
    }
    .pagination {
      display: flex;
      gap: 1rem;
      align-items: center;
      margin: 1rem 0;
      font-size: 0.9rem;
    }
    .pagination .disabled { color: #999; }
    .listing-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
    .row-list { border-top: 1px solid #8883; }
    .row-header {
      display: flex;
      gap: 0.75rem;
      align-items: baseline;
      padding: 0.6rem 0.2rem;
      border-bottom: 1px solid #8883;
    }
    .row-header a { flex: 2; font-weight: 600; color: inherit; }
    .row-header .col-company,
    .row-header .col-location {
      flex: 1;
      color: #777;
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .row-header .col-tag {
      font-size: 0.75rem;
      padding: 0.1rem 0.5rem;
      border: 1px solid #8886;
      border-radius: 4px;
      white-space: nowrap;
      color: #777;
    }
    .row-header .col-score { font-weight: 700; min-width: 2.2rem; text-align: right; }
    .row-header .toggle-btn {
      font-size: 0.8rem;
      background: transparent;
      border: 1px solid #8886;
      border-radius: 6px;
      padding: 0.25rem 0.6rem;
      color: inherit;
      cursor: pointer;
      white-space: nowrap;
    }
    .row-detail { padding: 0.75rem 1rem 1rem; border-bottom: 1px solid #8883; }
    .cost-breakdown { border-collapse: collapse; margin-bottom: 1.5rem; font-size: 0.9rem; }
    .cost-breakdown td { padding: 0.25rem 0.75rem 0.25rem 0; }
    .history-row {
      display: flex;
      gap: 0.75rem;
      align-items: baseline;
      padding: 0.5rem 0.2rem;
      border-bottom: 1px solid #8883;
      font-size: 0.85rem;
    }
    .history-row .col-time { flex: 1.4; color: #777; white-space: nowrap; }
    .history-row .col-tag {
      flex: 1.3;
      font-size: 0.75rem;
      padding: 0.1rem 0.5rem;
      border: 1px solid #8886;
      border-radius: 4px;
      white-space: nowrap;
      color: #777;
    }
    .history-row .col-detail {
      flex: 3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .history-row .col-turns { flex: 1.3; color: #777; text-align: right; white-space: nowrap; }
    .history-row .col-cost { flex: 0.8; font-weight: 600; text-align: right; white-space: nowrap; }
  </style>
</head>
<body>
  <nav>
    <a href="/">Results</a>
    <a href="/excluded">Excluded</a>
    <a href="/rejected">Rejected</a>
    <a href="/hidden">Hidden</a>
    <a href="/criteria">Criteria</a>
    <a href="/history">History</a>
  </nav>
  {% block content %}{% endblock %}
  <script>
    function toggleDetails(btn) {
      const row = btn.closest('.row');
      const detail = row.querySelector('.row-detail');
      if (detail.hasAttribute('hidden')) {
        detail.removeAttribute('hidden');
        btn.textContent = 'Hide details';
      } else {
        detail.setAttribute('hidden', '');
        btn.textContent = 'Show details';
      }
    }
  </script>
</body>
</html>
