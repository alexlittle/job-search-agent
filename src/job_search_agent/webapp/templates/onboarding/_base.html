<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Setup - Job Search Agent{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, system-ui, sans-serif;
      max-width: 640px;
      margin: 3rem auto;
      padding: 0 1rem;
      line-height: 1.5;
    }
    .step { color: #777; font-size: 0.9rem; margin-bottom: 0.25rem; }
    h1 { margin-top: 0; }
    label { display: block; margin-bottom: 1.1rem; font-weight: 600; }
    input[type=text], input[type=email], input[type=password], input[type=file] {
      display: block; width: 100%; margin-top: 0.3rem; font-weight: normal;
      padding: 0.4rem; box-sizing: border-box;
    }
    .hint { font-weight: normal; color: #777; font-size: 0.85rem; display: block; margin-top: 0.2rem; }
    .error { color: #c0392b; font-weight: 600; }
    button { padding: 0.5rem 1.2rem; font-size: 1rem; }
  </style>
</head>
<body>
  <p class="step">Setup &mdash; step {% block step_number %}?{% endblock %} of 4</p>
  {% block content %}{% endblock %}
</body>
</html>
