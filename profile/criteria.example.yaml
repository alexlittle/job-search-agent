# Template for criteria.yaml — copy this file to criteria.yaml and fill in your own values.
# criteria.yaml is gitignored, so your real preferences never get committed.

# Job titles/role types you're looking for. Free text, matched loosely later by the fit agent.
roles:
  - "Example Role Title"
  - "Another Role Title"

# Where you're willing to work. Include "Remote" if that counts.
locations:
  - "London, UK"
  - "Remote (UK)"

salary:
  currency: GBP
  minimum: 0

# Things a good match MUST have. Used to weight/explain fit, not just filter.
must_haves:
  - "Example must-have requirement"

# Things that rule a listing out immediately, regardless of everything else.
dealbreakers:
  - "Example dealbreaker"

keywords:
  # Words/phrases that should push a listing up in relevance if present.
  boost:
    - "example boost keyword"
  # Words/phrases that should push a listing down (but not necessarily disqualify it).
  avoid:
    - "example avoid keyword"

# Anything else worth telling the fit agent that doesn't fit the fields above.
notes: >
  Free-text notes for context the structured fields don't capture.
