# Example Apache vhost for running the dashboard under mod_wsgi instead of the Flask dev
# server, so it can start automatically on boot alongside Apache itself. Edit the paths below
# for your own machine, then:
#
#   uv add mod-wsgi                                    # compiles mod_wsgi against your Apache
#                                                       # (needs apache2-dev/apxs installed)
#   sudo cp apache-vhost.example.conf /etc/apache2/sites-available/job-search-agent.conf
#   echo "Listen 9040" | sudo tee -a /etc/apache2/ports.conf   # pick any free port
#   sudo a2ensite job-search-agent
#   sudo systemctl restart apache2
#
# Then check: curl -i http://localhost:9040/
#
# Two gotchas worth knowing before you do this:
#
# 1. python-dotenv's bare load_dotenv() (no explicit path) can't find .env under mod_wsgi. It
#    normally locates .env by walking up from the calling file's own directory, but falls back
#    to os.getcwd() whenever __main__ has no __file__ - true under mod_wsgi, where daemon
#    processes aren't launched via `python script.py`. The daemon's cwd is typically the
#    WSGIDaemonProcess user's home directory, not this project, so every load_dotenv() call
#    would silently fail to find .env and the dashboard would loop back to the onboarding
#    wizard as if nothing were configured. Fixed already in this codebase - every load_dotenv()
#    call passes `env_utils.ENV_PATH` explicitly - but worth knowing if you add a new module
#    that reads .env directly instead of going through the existing helpers
#    (`claude_client.py`, `user_agent.py`, `limits.py`, `env_utils.py`).
#
# 2. If you're already running other mod_wsgi sites on a different Python version under this
#    same Apache instance, only ONE mod_wsgi module can be loaded process-wide - Apache logs
#    "module wsgi_module is already loaded, skipping" for every LoadModule after the first, and
#    whichever one wins is what every WSGIDaemonProcess actually gets. Match this app's venv to
#    whatever Python version your other sites already use (see .python-version) to avoid a
#    silent version mismatch; the project's own code still only requires Python >=3.12
#    (pyproject.toml) even if the venv you deploy from is newer.
#
# The daemon below runs as your own user, not www-data - the dashboard's Settings page writes to
# .env and data/job_search.db, and giving Apache's own low-privilege user write access to a file
# holding your Anthropic API key is a worse trade than running the daemon as yourself on a
# single-user personal machine.

WSGIPythonHome "/path/to/job-search-agent/.venv"

<VirtualHost *:9040>

	WSGIApplicationGroup %{GLOBAL}
	LoadModule wsgi_module "/path/to/job-search-agent/.venv/lib/pythonX.Y/site-packages/mod_wsgi/server/mod_wsgi-pyXY.cpython-XY-x86_64-linux-gnu.so"

	WSGIDaemonProcess localhost.job-search-agent user=YOUR_USER group=YOUR_USER python-path=/path/to/job-search-agent/src:/path/to/job-search-agent/.venv/lib/pythonX.Y/site-packages
	WSGIScriptAlias / /path/to/job-search-agent/wsgi.py
	WSGIProcessGroup localhost.job-search-agent
	WSGIPassAuthorization On

	<Directory /path/to/job-search-agent/>
		<Files wsgi.py>
			Require all granted
		</Files>
	</Directory>

	ServerAdmin webmaster@localhost

	ErrorLog /var/log/apache2/job-search-agent-error.log
	LogLevel warn
	CustomLog /var/log/apache2/job-search-agent-access.log combined

</VirtualHost>
